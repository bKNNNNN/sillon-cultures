# Noms scientifiques des cultures (0.5.0). Une entree par culture de cultures.yaml, meme `id`.
# Usage : un service d'identification par photo (Pl@ntNet) repond par un nom scientifique ; ce fichier
# dit quelles cultures de la base ce nom peut designer. Le fichier est separe de cultures.yaml pour que
# sillon-core 0.4.0 a 0.6.0, dont le schema de culture refuse tout champ inconnu, lisent encore la base.
#
# Regles :
# - `scientificNames` : noms sans auteur, ecrits comme scripts/scientific-names.mjs les affiche
#   (genre en majuscule, signe hybride `×` suivi d'une espace, un seul rang infraspecifique au plus :
#   `subsp.`, `var.`, `convar.` ou `f.`). Le nom accepte vient en premier, puis les synonymes
#   qu'un service peut encore renvoyer.
# - Un meme nom peut figurer dans plusieurs cultures : Beta vulgaris est betterave et blette, Brassica
#   oleracea chou d'ete et chou d'hiver, Raphanus sativus radis et radis d'hiver, Brassica rapa chou
#   chinois et navet, Cucurbita pepo courgette et courge. La photo ne les distingue pas : l'application
#   propose les candidates et le jardinier choisit. Un rang infraspecifique liste par une seule culture
#   la designe seule (Raphanus sativus var. niger : radis d'hiver).
# - Lecture (contrat pour l'application et sillon-core) : nom compare sans auteur, sans casse, signe
#   hybride ignore ; d'abord le nom complet, puis, si le nom porte un rang que personne ne liste, le
#   binome seul, parmi les cultures qui listent ce binome. Rien ne correspond : afficher le nom brut et
#   "pas dans la base".
# - Ce ne sont pas des valeurs agronomiques : chaque entree porte une `source`, pas d'`estimate`.
#
# Source : GBIF Backbone Taxonomy (https://www.gbif.org/dataset/d7dddbf4-2cf0-4f39-9b2a-bb099caae36c),
# lue le 2026-10-21 par l'API https://api.gbif.org/v1/species/match (kingdom=Plantae, strict=true) et
# https://api.gbif.org/v1/species?name=... pour les synonymes. Chaque `source` donne le statut et la cle
# GBIF de chaque nom. Pl@ntNet renvoie avec chaque espece un identifiant GBIF et un identifiant POWO
# (documentation https://my.plantnet.org/doc/api/identify) ; ses noms suivent donc la meme nomenclature.
# Le referentiel exact de Pl@ntNet n'a pas ete lu : un nom renvoye mais absent ici s'ajoute par une
# correction, avec sa cle GBIF.
#
# Laisses hors de la base, faute de culture qui leur corresponde : Phaseolus coccineus (haricot d'Espagne),
# Fragaria vesca (fraise des bois), Diplotaxis tenuifolia (roquette sauvage), Cichorium endivia (chicorees).

