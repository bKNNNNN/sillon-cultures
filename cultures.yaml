# Base cultures. Une culture par bloc.
# Regles : une valeur porte `source` seulement si le texte du document cite a ete
# lu et contient cette valeur, ou l'information dont elle derive directement. Sinon
# elle porte `estimate: true` seul. `estimate: true` ne tombe que si la source est
# propre a la Gironde, a la Nouvelle-Aquitaine, au Sud-Ouest ou a une zone oceanique
# douce qui couvre explicitement Bordeaux.
#
# Fenetres (`sowUnderCover`, `sowDirect`, `transplant`) : semaines ISO (1-53),
# from > to autorise (passage du nouvel an).
# Une fenetre `{ from, to }`, ou une liste de fenetres quand la culture a deux saisons.
# Regle mois vers semaines : une source donne des mois. "Debut de mois" = semaine ISO
# du premier lundi du mois, "fin de mois" = semaine ISO du dernier lundi du mois,
# calculees sur 2026 (les numeros bougent d'une semaine au plus selon l'annee).
# Debuts de mois utilises : fevrier S6, mars S10, avril S15, mai S19.
# `sowDirect` couvre aussi la plantation de caieux (ail) et de tubercules (pomme de terre).
#
# Sources regionales lues pour les fenetres (aucune ne donne de fenetre complete) :
# - Jardiner Malin, calendrier par climat, https://www.jardiner-malin.fr/fiche/calendrier-semis-recolte-potager.html :
#   Aquitaine et Poitou-Charentes classes en climat semi-oceanique. Carottes, laitues,
#   oignons, poireaux, radis semes "tout au long du mois de mars" (debut S10) ; pommes de
#   terre "des debut avril" en Aquitaine (S15) ; tomates, haricots, courgettes, concombres
#   "des debut mai" en Aquitaine (S19).
# - Bordeaux au Vert (maraicher bio de Bordeaux), https://www.bordeaux-transition.org/semer-en-fevrier-sous-la-fenetre-ce-qui-leve-a-bordeaux-avant-avril/ :
#   tomates, basilic, persil et certaines salades semes a l'interieur "des fevrier" (debut S6) ;
#   gelees tardives possibles jusqu'a mi-avril, plus longtemps pres de la Garonne.
# - Meteo-France, fiche climatologique 1991-2020 de Bordeaux-Merignac (33281001),
#   https://object.files.data.gouv.fr/meteofrance/data/synchro_ftp/REF_STATION/FICHECLIM_33281001.pdf :
#   jours moyens avec Tn <= 0 C : mars 1.8, avril 0.1, mai 0. Cadre pour les plantations
#   de cultures sensibles au gel ; aucune fenetre n'en est derivee mecaniquement.
# - Conseil departemental de la Gironde, livret "Graine d'assiette" 2016-2017,
#   https://www.gironde.fr/sites/default/files/2017-06/cdj2017-graine-assiette.pdf :
#   semis de printemps et d'ete ideal en mars, plants au potager environ deux mois plus
#   tard, apres les dernieres gelees. Le calendrier par legume (p. 11) est une image : il a
#   ete lu a l'oeil le 2026-10-17. Il donne, par mois entier, semailles, plantation, recolte
#   et couverture plastique. Il fournit les fenetres completes de 15 cultures (17 champs).
#   Lecture des couleurs : vert = semailles, beige = plantation a partir des semis.
#   Semailles devient `sowDirect`, plantation devient `transplant` ; `sowUnderCover` n'en
#   tire rien (le livret ne distingue pas abri et pleine terre). Absents du livret :
#   courgette, courge, poireau, fraise, basilic. Limites : livret pedagogique ecrit par le
#   Conseil departemental des jeunes, pas un document technique, et precision au mois ;
#   ces fenetres gardent donc `estimate: true`. Il donne deux saisons de semis pour radis,
#   epinard et laitue : le champ porte alors une liste de deux fenetres.
# Chambre d'agriculture, FREDON, INRAE : aucun calendrier amateur Gironde lisible trouve.
#
# Ce qui reste une estimation : TOUTES les fenetres, y compris celles du livret. Quand une source regionale ne donne
# que le debut de la fenetre, `from` en derive, `to` reste l'ancienne valeur, et la
# `source` le dit ("from: ... to: ..."). Les fenetres sans source regionale gardent leur
# valeur, un commentaire au-dessus, et `estimate: true` ; si elles citent encore le
# calendrier CIVAM/ARS Auvergne-Rhone-Alpes (plus froid que le Medoc), ce n'est qu'une
# reference, non adaptee. Aucune fenetre n'a ete tiree de la memoire.
#
# `firstHarvestDays` : delai jusqu'a la PREMIERE recolte, `from` dit si les jours courent
# depuis le semis (`sowing`) ou la plantation (`transplant`). Toutes les valeurs actuelles
# partent du semis. Regle de la fourchette : si la source donne une fourchette, on garde
# la borne basse. Conversion : 1 semaine = 7 jours, 1 mois = 30 jours. Sources : fiches
# culture Jardiner Malin et fiches produit Vilmorin vendues par Truffaut, nationales (une
# variete pour radis, betterave, concombre, petit pois, epinard), donc `estimate: true`.
# Aucune valeur pour les autres cultures : pas de source lue (tomate, poireau, etc.).
#
# `daysToMaturity` : duree totale de saison (colonne Total) du tableau 11 de la FAO 56,
# pas une premiere recolte. Les 14 valeurs ont ete relues le 2026-10-16 dans le texte du
# tableau (https://www.fao.org/4/x0490e/x0490e0b.htm) ; chaque `source` nomme la ligne
# retenue (culture, date de semis, region). Aucune ligne ne vise le Bordelais : les
# valeurs gardent `estimate: true`.
# `kc` : valeurs lues dans les jeux de donnees du paquet R FAO56 (extraits du tableau 12 de
# la FAO 56) et toutes verifiees. Pour la tomate, le tableau donne une fin de saison de
# 0.70 a 0.90 ; `late: 0.8` est le milieu de cette fourchette.
# `seedLifespanYears` : valeurs relevees dans un resume de resultat de recherche de la page
# "Espace pour la vie, conservation des semences de legumes" (page illisible, erreur 403) ;
# AUCUNE source citee. Fourchette ramenee a sa borne basse (courge 6-8 -> 6, radis 4-5 -> 4).
# Aucun `gdd` : aucune source de degres-jours vers la maturite n'a ete trouvee.
# Associations : synthese de fiches grand public (neozone.org, FREDON Auvergne-Rhone-Alpes,
# goodfood.brussels), non sourcees valeur par valeur.

- id: tomate
  name: Tomate
  family: solanacees
  # Debut de fenetre : source regionale lue. Fin de fenetre : non regionale, estimation conservee.
  sowUnderCover: { value: { from: 6, to: 13 }, estimate: true, source: "from: Bordeaux au Vert, maraicher bio de Bordeaux, https://www.bordeaux-transition.org/semer-en-fevrier-sous-la-fenetre-ce-qui-leve-a-bordeaux-avant-avril/. to: calendrier CIVAM/ARS Auvergne-Rhone-Alpes, non regional" }
  # Fenetre complete tiree du livret du Departement de la Gironde (mois entiers) : estimation conservee, livret non technique.
  transplant: { value: { from: 19, to: 36 }, estimate: true, source: "Livret Graine d'assiette, Conseil departemental des jeunes de la Gironde 2016-2017, calendrier p. 11 (image lue), https://www.gironde.fr/sites/default/files/2017-06/cdj2017-graine-assiette.pdf : Tomates, plantation mai-aout" }
  tBaseC: { value: 10.0, source: "Purdue MRCC (Tbase en F converti en C), https://mrcc.purdue.edu/resources/growing-degree-day-description", estimate: true }
  daysToMaturity: { value: 155, source: "FAO-56 tableau 11, ligne Tomato, Apr/May, Calif., USA, https://www.fao.org/4/x0490e/x0490e0b.htm", estimate: true }
  spacingCm: { value: { inRow: 50, betweenRows: 70 }, estimate: true }
  kc: { value: { initial: 0.6, mid: 1.15, late: 0.8 }, source: "FAO-56 tableau 12 via jeux de donnees du paquet R FAO56 1.0, https://cran.r-project.org/src/contrib/FAO56_1.0.tar.gz", estimate: true }
  frostSensitive: true
  goodCompanions: [carotte, oignon, poireau, basilic, chou, persil, ail]
  badCompanions: [pomme-de-terre, betterave]
  seedLifespanYears: { value: 3, source: "Alsagarden, tableau 'Duree de conservation et germination des graines potageres', https://www.alsagarden.com/blog/duree-de-conservation-et-germination-des-graines-potageres/ (Tomate, 3 a 4 ans, borne basse)", estimate: true }
  maturitySigns: "Fruits bien colorés et fermes, qui se détachent facilement du pied."

