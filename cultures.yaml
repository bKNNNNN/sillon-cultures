# Base cultures. Une culture par bloc.
# Regles : une valeur porte `source` seulement si le texte du document cite a ete
# lu et contient cette valeur. Sinon elle porte `estimate: true` seul. Les valeurs
# issues de sources non specifiques au Bordelais portent `estimate: true` en plus.
# Fenetres : semaines ISO (1-53), from > to autorise (passage du nouvel an).
# Fenetres de semis : estimations pour la Gironde (derniers gels vers mi-avril).
# Quand une `source` CIVAM/ARS est citee, ce sont les valeurs du calendrier
# Auvergne-Rhone-Alpes, plus froid, NON adaptees au Medoc. Aucun ajustement chiffre
# n'a ete applique : la fenetre saisie est une estimation, la source n'est qu'une reference.
# `sowDirect` couvre aussi la plantation de caieux (ail) et de tubercules (pomme de terre).
# `daysToMaturity` : duree totale de saison (colonne Total) du tableau 11 de la FAO 56,
# pas une premiere recolte. Les 14 valeurs ont ete relues le 2026-10-16 dans le texte du
# tableau (https://www.fao.org/4/x0490e/x0490e0b.htm) ; chaque `source` nomme la ligne
# retenue (culture, date de semis, region). Aucune ligne ne vise le Bordelais : les
# valeurs gardent `estimate: true`.
# `kc` : valeurs lues dans les jeux de donnees du paquet R FAO56 (extraits du tableau 12 de
# la FAO 56) et toutes verifiees. Pour la tomate, le tableau donne une fin de saison de
# 0.70 a 0.90 ; `late: 0.8` est le milieu de cette fourchette.
# `seedLifespanYears` : valeurs relevees dans un resume de resultat de recherche de la page
# "Espace pour la vie, conservation des semences de legumes" (page illisible, erreur 403) ;
# AUCUNE source citee. Fourchette ramenee a sa borne basse (courge 6-8 -> 6, radis 4-5 -> 4).
# Aucun `gdd` : aucune source de degres-jours vers la maturite n'a ete trouvee.
# Associations : synthese de fiches grand public (neozone.org, FREDON Auvergne-Rhone-Alpes,
# goodfood.brussels), non sourcees valeur par valeur.

